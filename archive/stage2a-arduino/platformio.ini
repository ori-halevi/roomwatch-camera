; Archived stage 2a: Arduino firmware (modem sleep only, ~58mA idle measured).
; Kept for reference and for its power_test env. Secrets come from the root include/.

[env:xiao_esp32s3_sense]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

; The S3R8 chip has 8MB octal PSRAM - required for camera frame buffers.
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I../../include

monitor_speed = 115200

; Same firmware, but first steps through power states for multimeter readings.
[env:power_test]
extends = env:xiao_esp32s3_sense
build_flags =
    ${env:xiao_esp32s3_sense.build_flags}
    -DPOWER_TEST
