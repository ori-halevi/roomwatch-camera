<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הרכבת המצלמה</title>
<style>
:root {
  --bg: #eef0ee; --panel: #ffffff; --ink: #1d2320; --mute: #5d6862; --line: #d5dbd6;
  --accent: #d9731c; --accent-ink: #ffffff; --chip: #f3f5f3; --label-bg: rgba(255,255,255,.92);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1f1d; --panel: #242926; --ink: #e8ece9; --mute: #a3ada7; --line: #39403c;
    --accent: #f08a33; --accent-ink: #1b1f1d; --chip: #2d332f; --label-bg: rgba(36,41,38,.92);
  }
}
:root[data-theme="dark"] {
  --bg: #1b1f1d; --panel: #242926; --ink: #e8ece9; --mute: #a3ada7; --line: #39403c;
  --accent: #f08a33; --accent-ink: #1b1f1d; --chip: #2d332f; --label-bg: rgba(36,41,38,.92);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, "Segoe UI", Arial, sans-serif; display: grid; grid-template-columns: minmax(300px, 380px) 1fr; }
aside > * { flex-shrink: 0; }
aside { background: var(--panel); border-inline-end: 1px solid var(--line); padding: 18px 20px; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 14px; }
h1 { font-size: 20px; margin: 0; }
.sub { color: var(--mute); font-size: 14px; margin: 0; }
ol.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
ol.steps button { width: 100%; text-align: start; background: var(--chip); color: var(--ink); border: 1px solid transparent; border-radius: 8px; padding: 8px 10px; font: inherit; cursor: pointer; }
ol.steps button[aria-current="step"] { border-color: var(--accent); font-weight: 600; }
.text { background: var(--chip); border-radius: 10px; padding: 12px 14px; min-height: 120px; }
.text h2 { font-size: 17px; margin: 0 0 6px; }
.text p { margin: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { background: var(--chip); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; font: inherit; cursor: pointer; }
.btn.main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn:disabled { opacity: .4; cursor: default; }
label.chk { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; font-size: 14px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.hint { color: var(--mute); font-size: 13px; }
main { position: relative; min-width: 0; min-height: 0; }
#view { position: absolute; inset: 0; }
.lbl { background: var(--label-bg); color: var(--ink); border: 1.5px solid var(--accent); border-radius: 6px; padding: 2px 8px; font-size: 13px; white-space: nowrap; pointer-events: none; direction: rtl; }
.lbl::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 2px; height: 6px; background: var(--accent); }
#loading[hidden] { display: none; }
#loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mute); }
@media (max-width: 760px) {
  body { grid-template-columns: 1fr; grid-template-rows: 55vh auto; }
  main { grid-row: 1; }
  aside { grid-row: 2; border-inline-end: 0; border-top: 1px solid var(--line); padding: 14px 16px; }
}
</style>
</head>
<body>
<aside>
  <div>
    <h1>הרכבת המצלמה בעגלה</h1>
    <p class="sub">אנימציה צעד אחר צעד. אפשר לסובב ולהגדיל את התמונה עם העכבר.</p>
  </div>
  <ol class="steps" id="steps"></ol>
  <div class="text" id="text"></div>
  <div class="row">
    <button class="btn" id="prev">הקודם</button>
    <button class="btn main" id="play">נגן שוב</button>
    <button class="btn" id="next">הבא</button>
  </div>
  <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="התקדמות האנימציה">
  <div class="row">
    <label class="chk"><input type="checkbox" id="glass" checked> מחזיק ועגלה שקופים</label>
    <label class="chk"><input type="checkbox" id="labels" checked> תוויות</label>
  </div>
  <p class="hint">צבעים: העגלה אפורה-כהה, המחזיק חום, המצלמה שחורה, הסרט כתום, הברגים כסופים. המידות לקוחות מהמודל של הקופסה.</p>
</aside>
<main>
  <div id="view"></div>
  <div id="loading">טוען…</div>
</main>

// Frame: origin = the lens tip, +y = where the lens looks, +z = up (rocker coordinates
// of camera_enclosure.scad). The carriage STL is in arc-centre coordinates, so it is
// shifted back by R + face_out.
const R_FACE = 42.823 + 0.8;

const host = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
host.append(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.domElement.style.cssText = "position:absolute;inset:0;pointer-events:none;overflow:hidden";
labelRenderer.domElement.dir = "ltr";  // CSS2D places labels from the left edge
host.append(labelRenderer.domElement);

const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(35, 1, 0.5, 2000);
cam.up.set(0, 0, 1);
const controls = new OrbitControls(cam, renderer.domElement);
controls.enableDamping = true;

const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(60, 80, 120); scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.6); fill.position.set(-80, -40, -30); scene.add(fill);

const loader = new STLLoader();
const b64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0)).buffer;
const edgeMat = new THREE.LineBasicMaterial({ color: 0x111111, transparent: true, opacity: 0.45 });
function part(name, color) {
  const geo = loader.parse(b64(MODELS[name]));
  geo.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.7, side: THREE.DoubleSide });
  const m = new THREE.Mesh(geo, mat);
  m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 30), edgeMat));
  return m;
}
// split the 4-screw STL into the left and right pair, so they can fly in from each side
function splitScrews() {
  const geo = loader.parse(b64(MODELS.screws));
  const pos = geo.attributes.position.array, L = [], Rr = [];
  for (let i = 0; i < pos.length; i += 9) {
    const cx = (pos[i] + pos[i + 3] + pos[i + 6]) / 3;
    (cx < 0 ? L : Rr).push(...pos.slice(i, i + 9));
  }
  return [L, Rr].map(a => {
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(a, 3));
    g.computeVertexNormals();
    const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: "#b9bec4", metalness: 0.5, roughness: 0.35 }));
    m.add(new THREE.LineSegments(new THREE.EdgesGeometry(g, 30), edgeMat));
    return m;
  });
}

  const N = 80, w = 7.6 / 2, pos = [], idx = [];
  for (let i = 0; i <= N; i++) {
    const p = curve.getPoint(i / N);
    pos.push(p.x - w, p.y, p.z, p.x + w, p.y, p.z);
    if (i < N) { const a = 2 * i; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals();
  flex.geometry.dispose(); flex.geometry = g;
}

// labels
function label(text, parent, p) {
  const d = document.createElement("div"); d.className = "lbl"; d.textContent = text;
  const o = new CSS2DObject(d); o.position.set(...p); o.center.set(0.5, 1.25); parent.add(o); return o;
}
const L = {
  lens: label("העדשה פונה קדימה", slide, [0, 3, 6]),
  pocket: label("פתח המחזיק (מלפנים)", lift, [0, -8, 7]),
  rNotch: label("פתח בתחתית המחזיק: הסרט יוצא מכאן", lift, [0, -12, -6]),
  cNotch: label("פתח בתחתית העגלה (פתוח גם מאחור)", carGroup, [0, -20, -15]),
  top: label("העגלה פתוחה מלמעלה", carGroup, [0, -14, 15.5]),
  slots: label("חריצים מעוגלים בדופן", carGroup, [8.5, -15.4, 6]),
  screws: label("2 ברגים מכל צד", lift, [12, -15.4, 3]),
  tilt: label("המצלמה מוטה סביב קצה העדשה", carGroup, [0, 2, 9]),
  loop: label("לולאה רפויה אל ה-XIAO", carGroup, [0, -23, -40]),
  car: label("העגלה", carGroup, [0, -18, 16]),
  rk: label("המחזיק", lift, [0, -17, 4]),
  cm: label("המצלמה", slide, [0, -4, 6]),
  sc: label("4 ברגים", lift, [17, -15, 3]),
};
const allLabels = Object.values(L);

const ease = t => t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
const seg = (t, a, b) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));

// each step: text, which labels, camera view, duration, and pose(t)
const STEPS = [
  { title: "החלקים", labels: ["car", "rk", "cm", "sc"], view: [70, 80, 45], target: [0, -8, 4], dur: 1,
    text: "אלה החלקים: העגלה (אפורה-כהה) שנוסעת בחריץ של הכיפה, המחזיק החום שבתוכו יושבת המצלמה, המצלמה עם הסרט הכתום, וארבעה ברגים קטנים.",
    pose: () => ({ car: 1, lift: 30, slide: 24, screws: 20, tilt: 0, long: false }) },
  { title: "1. המצלמה נכנסת למחזיק", labels: ["lens", "pocket", "rNotch"], view: [45, 55, -10], target: [0, -6, -2], dur: 4,
    text: "מחזיקים את המחזיק החום. דוחפים לתוכו את המצלמה מלפנים: העדשה העגולה נשארת בחוץ ופונה קדימה, והחלק המרובע שמאחוריה נכנס פנימה עד הסוף. הסרט הכתום יוצא למטה, דרך הפתח שבתחתית המחזיק.",
    pose: t => ({ car: 0, lift: 0, slide: 24 * (1 - seg(t, 0.1, 0.85)), screws: 20, tilt: 0, long: false, showScrews: false }) },
  { title: "2. המחזיק נכנס לעגלה", labels: ["top", "cNotch"], view: [60, 50, 30], target: [0, -10, -4], dur: 4,
    text: "מורידים את המחזיק, עם המצלמה בתוכו, לתוך העגלה מלמעלה, כשהעדשה קדימה. הסרט עובר דרך הפתח שבתחתית העגלה. הפתח פתוח גם מאחור, אז אפשר פשוט להניח בו את הסרט, בלי להשחיל.",
    pose: t => ({ car: 1, lift: 32 * (1 - seg(t, 0.1, 0.85)), slide: 0, screws: 20, tilt: 0, long: t > 0.85, showScrews: false }) },
  { title: "3. ארבעה ברגים", labels: ["slots", "screws"], view: [75, 10, 30], target: [0, -14, 0], dur: 3,
    text: "מכניסים ארבעה ברגים, שניים מכל צד, דרך החריצים המעוגלים שבדופן העגלה, אל החורים בחלק האחורי של המחזיק. מהדקים בעדינות, רק עד שמרגישים חיכוך קל. אל תהדק חזק.",
    pose: t => ({ car: 1, lift: 0, slide: 0, screws: 20 * (1 - seg(t, 0.1, 0.8)), tilt: 0, long: true }) },
  { title: "4. ההטיה למעלה ולמטה", labels: ["tilt"], view: [80, 30, 10], target: [0, -10, -4], dur: 6, loop: true,
    text: "עכשיו אפשר להטות את המצלמה למעלה או למטה. הברגים נוסעים בחריצים, והחיכוך שלהם מחזיק את הזווית. העדשה נשארת תמיד באותו מקום בחזית, היא רק מסתובבת.",
    pose: t => ({ car: 1, lift: 0, slide: 0, screws: 0, tilt: -5 + 43 * (0.5 - 0.5 * Math.cos(t * 2 * Math.PI)), long: true }) },
  { title: "5. הסרט אל ה-XIAO", labels: ["loop", "cNotch"], view: [110, 70, -5], target: [0, -14, -24], dur: 1,
    text: "מהעגלה הסרט ממשיך למטה כלולאה רפויה, ומשם אל המחבר של ה-XIAO. יש לו אורך עודף, אז לא מותחים אותו, ולא מקפלים אותו בחדות, רק בקשת רכה.",
    pose: () => ({ car: 1, lift: 0, slide: 0, screws: 0, tilt: 20, long: true }) },
];

const ui = { steps: document.getElementById("steps"), text: document.getElementById("text"), scrub: document.getElementById("scrub"),
  glass: document.getElementById("glass"), labels: document.getElementById("labels") };
STEPS.forEach((s, i) => {
  const li = document.createElement("li"), b = document.createElement("button");
  b.textContent = s.title; b.onclick = () => go(i); li.append(b); ui.steps.append(li);
});

let cur = 0, t0 = 0, playing = true, camFrom = null, camTo = null, camT = 1;
function applyPose(p) {
  carriage.visible = p.car > 0;
  lift.position.z = p.lift;
  slide.position.y = p.slide;
  screwL.position.x = -p.screws; screwR.position.x = p.screws;
  screwL.visible = screwR.visible = p.showScrews !== false;
  tilt.rotation.x = -p.tilt * Math.PI / 180;
  flexLong = p.long;
  updateFlex();
}
function setGlass() {
  const g = ui.glass.checked;
  for (const m of [rocker, carriage]) { m.material.transparent = g; m.material.opacity = g ? 0.42 : 1; m.material.depthWrite = !g; }
}
function setLabels() {
  const on = new Set(ui.labels.checked ? STEPS[cur].labels : []);
  for (const [k, o] of Object.entries(L)) o.visible = on.has(k);
}
function go(i) {
  cur = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[cur];
  [...ui.steps.querySelectorAll("button")].forEach((b, k) => k === cur ? b.setAttribute("aria-current", "step") : b.removeAttribute("aria-current"));
  ui.text.innerHTML = `<h2>${s.title}</h2><p>${s.text}</p>`;
  document.getElementById("prev").disabled = cur === 0;
  document.getElementById("next").disabled = cur === STEPS.length - 1;
  camFrom = { p: cam.position.clone(), t: controls.target.clone() };
  camTo = { p: new THREE.Vector3(...s.view), t: new THREE.Vector3(...s.target) };
  camT = 0;
  setLabels();
  restart();
}
function restart() { t0 = performance.now(); playing = true; }
document.getElementById("prev").onclick = () => go(cur - 1);
document.getElementById("next").onclick = () => go(cur + 1);
document.getElementById("play").onclick = restart;
ui.scrub.oninput = () => { playing = false; applyPose(STEPS[cur].pose(ui.scrub.value / 1000)); };
ui.glass.onchange = setGlass;
ui.labels.onchange = setLabels;

function resize() {
  const w = host.clientWidth, h = host.clientHeight;
  renderer.setSize(w, h); labelRenderer.setSize(w, h);
  cam.aspect = w / h; cam.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(host);

const HOLD = 1500;  // ms pause at the end before a step's animation repeats
function frame(now) {
  const s = STEPS[cur];
  if (playing) {
    const ms = s.dur * 1000, el = now - t0;
    let t = s.loop ? (el % ms) / ms : Math.min(1, el / ms);
    if (!s.loop && el > ms + HOLD && s.dur > 1) t0 = now;  // replay
    ui.scrub.value = Math.round(t * 1000);
    applyPose(s.pose(t));
  }
  if (camT < 1) {
    camT = Math.min(1, camT + 0.03);
    const k = ease(camT);
    cam.position.lerpVectors(camFrom.p, camTo.p, k);
    controls.target.lerpVectors(camFrom.t, camTo.t, k);
  }
  controls.update();
  renderer.render(scene, cam);
  labelRenderer.render(scene, cam);
  requestAnimationFrame(frame);
}
cam.position.set(...STEPS[0].view); controls.target.set(...STEPS[0].target);
setGlass(); resize(); go(+(location.hash.match(/step=(\d)/) || [0, 0])[1]);
{
  const m = location.hash.match(/t=([\d.]+)/);
  if (m) { playing = false; camT = 1; cam.position.copy(camTo.p); controls.target.copy(camTo.t); applyPose(STEPS[cur].pose(+m[1])); }
}
document.getElementById("loading").hidden = true;
requestAnimationFrame(frame);
</script>
</body>
