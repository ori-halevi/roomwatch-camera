; Stage 2b: ESP-IDF build, so automatic light sleep can be enabled (see sdkconfig.defaults).
; The previous Arduino firmware lives in archive/stage2a-arduino.

[env:xiao_esp32s3_sense]
platform = espressif32
board = seeed_xiao_esp32s3
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.embed_txtfiles = src/index.html

; Same firmware without light sleep, so the USB console stays alive for debugging.
[env:debug]
extends = env:xiao_esp32s3_sense
build_flags = -DUSE_LIGHT_SLEEP=0

; Wi-Fi upload (after building the env above): python tools/ota.py
